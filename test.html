<!DOCTYPE html>
<html lang="en">

<body>
    <!-- Encapsulated Styles inside Body -->
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #000;
            margin: 0;
            padding: 40px;
            /* Ensure content is left-aligned */
            display: block;
        }

        .bit-test-wrapper {
            width: 100%;
            max-width: 100%;
            text-align: left;
        }

        /* Title styling to match retro aesthetic */
        h1.bit-preview-title {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-weight: bold;
            font-size: 1.25rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 40px;
            margin-top: 0;
            display: block;
            text-align: left;
        }
    </style>

    <div class="bit-test-wrapper">
        <h1 class="bit-preview-title">Tour Dates</h1>

        <!-- Bandsintown Events Widget -->
        <div id="bit-widget" data-artist="Paula Prieto" data-theme="light" data-button-text="BUY" data-locale="es">
        </div>

        <!-- Script source points to local worker -->
        <script src="http://localhost:8787/embed.js" defer></script>
    </div>

</body>

</html>
